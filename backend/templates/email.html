<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StimulApp</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F0E8; font-family:'Helvetica Neue', Arial, sans-serif; color:#2E1A20;">

  <!-- CONTENEDOR PRINCIPAL -->
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F0E8; padding: 40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">

          <!-- CABECERA -->
          <tr>
            <td style="background-color:#5C1E2C; padding: 32px 40px; text-align:center; border-bottom: 4px solid #7B2D3E;">
              <div style="font-family:Georgia, 'Times New Roman', serif; font-size:28px; font-weight:300; color:#F5F0E8; letter-spacing:6px; text-transform:uppercase;">
                STIMUL<span style="font-weight:700; color:#ffffff;">APP</span>
              </div>
              <div style="font-size:12px; color:#C8BCA8; letter-spacing:2px; text-transform:uppercase; margin-top:6px;">
                Estimula tu mente · Vive mejor
              </div>
            </td>
          </tr>

          <!-- CUERPO -->
          <tr>
            <td style="padding: 40px 40px 32px;">

              <!-- SALUDO -->
              <p style="font-size:20px; font-weight:600; color:#5C1E2C; margin:0 0 8px 0;">
                {{SALUDO}}
              </p>

              <!-- ICONO + TÍTULO -->
              <div style="text-align:center; margin: 28px 0 24px;">
                <div style="font-size:48px; line-height:1;">{{ICONO}}</div>
                <h1 style="font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:600; color:#5C1E2C; margin:12px 0 0; letter-spacing:1px;">
                  {{TITULO}}
                </h1>
              </div>

              <!-- MENSAJE PRINCIPAL -->
              <div style="font-size:16px; line-height:1.8; color:#6B5460; margin-bottom:24px;">
                {{CUERPO}}
              </div>

              <!-- BLOQUE DESTACADO (opcional) -->
              {{BLOQUE_DESTACADO}}

              <!-- BOTÓN (opcional) -->
              {{BOTON}}

            </td>
          </tr>

          <!-- PIE -->
          <tr>
            <td style="background-color:#5C1E2C; padding: 20px 40px; text-align:center; border-top: 3px solid #7B2D3E;">
              <p style="font-size:11px; color:#C8BCA8; letter-spacing:1.5px; text-transform:uppercase; margin:0;">
                <span style="color:#F5F0E8; font-weight:500;">StimulApp</span> · Correo generado automáticamente · <a href="mailto:{{EMAIL_REMITENTE}}" style="color:#C8BCA8; text-decoration:none;">{{EMAIL_REMITENTE}}</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
